[build-system]
requires = ["setuptools>=63", "wheel>=0.40"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-ledger"
version = "1.0.1"
description = "Local-first customer quick-entry ledger desktop application"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4",
    "Flask-Migrate>=4.0,<5",
    "Flask-SQLAlchemy>=3.1,<4",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
    "xlwt>=1.3,<2",
]
release = [
    "pywebview>=6,<7",
    "waitress>=3,<4",
]
build = [
    "PyInstaller>=6,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
