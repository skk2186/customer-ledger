<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}客户快捷填表系统{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('main.index') }}">客户快捷填表系统</a>
        <nav class="top-nav">
            <a href="{{ url_for('main.new_shipment') }}">新增一笔</a>
            <a href="{{ url_for('main.summary') }}">客户汇总总表</a>
            <a href="{{ url_for('main.customers') }}">客户管理</a>
        </nav>
    </header>
    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
