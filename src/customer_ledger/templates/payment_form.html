{% extends "base.html" %}
{% block title %}新增收款 - 客户快捷填表系统{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">记账</p><h1>新增收款</h1></div></div>
{% if error %}<div class="flash error">{{ error }}</div>{% endif %}
<form class="card form" method="post">
    <input type="hidden" name="submission_token" value="{{ token }}">
    <label for="customer_id">客户 <span class="required">*</span></label>
    <select id="customer_id" name="customer_id" required>
        <option value="">请选择客户</option>
        {% for item in customers %}<option value="{{ item.id }}"{% if values.customer_id|string == item.id|string %} selected{% endif %}>{{ item.name }}</option>{% endfor %}
    </select>
    <label for="payment_date">日期 <span class="required">*</span></label>
    <input id="payment_date" name="payment_date" type="date" value="{{ values.payment_date }}" required>
    <label for="amount">收款金额 <span class="required">*</span></label>
    <input id="amount" name="amount" inputmode="decimal" placeholder="0.00" value="{{ values.amount }}" required>
    <label for="payment_method">付款方式 <span class="required">*</span></label>
    <select id="payment_method" name="payment_method" required>
        {% for method in payment_methods %}<option value="{{ method }}"{% if values.payment_method == method %} selected{% endif %}>{{ method }}</option>{% endfor %}
    </select>
    <label for="description">收款说明</label>
    <textarea id="description" name="description" rows="3">{{ values.description }}</textarea>
    <fieldset>
        <legend>收款分配</legend>
        <label><input type="radio" name="allocation_mode" value="none"{% if values.allocation_mode == 'none' %} checked{% endif %}> 暂不分配，记作预收</label>
        <label><input type="radio" name="allocation_mode" value="auto"{% if values.allocation_mode == 'auto' %} checked{% endif %}> 按最早未结清发货自动分配</label>
        <label><input type="radio" name="allocation_mode" value="specified"{% if values.allocation_mode == 'specified' %} checked{% endif %}> 分配到指定发货</label>
        <label for="shipment_id">指定发货</label>
        <select id="shipment_id" name="shipment_id">
            <option value="">请选择发货</option>
            {% for shipment in shipments %}<option value="{{ shipment.id }}"{% if values.shipment_id|string == shipment.id|string %} selected{% endif %}>{{ shipment.shipment_date }} · #{{ shipment.id }} · {{ shipment.total_amount_cents|yuan }} 元</option>{% endfor %}
        </select>
        <label for="allocation_amount">指定分配金额</label>
        <input id="allocation_amount" name="allocation_amount" inputmode="decimal" placeholder="0.00" value="{{ values.allocation_amount }}">
        <p class="help">一笔收款可以在服务层分配到多笔发货；此页面提供最简单的一笔指定分配。</p>
    </fieldset>
    <div class="form-actions"><button class="button" type="submit">保存收款</button><a href="{{ url_for('main.customers') }}">取消</a></div>
</form>
{% endblock %}
