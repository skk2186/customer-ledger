{% extends "base.html" %}
{% block title %}首页 - 客户快捷填表系统{% endblock %}
{% block content %}
<section class="hero">
    <p class="eyebrow">日常记账工作台</p>
    <h1>今天的账，从一笔发货开始。</h1>
    <p>用清楚的发货、收款和客户汇总，把每天的账务留在本机。</p>
</section>
<section class="entry-grid">
    <a class="entry-card" href="{{ url_for('main.new_shipment') }}">
        <span class="entry-number">01</span><strong>新增一笔</strong>
        <span>录入发货，可同时登记初始收款。</span>
    </a>
    <a class="entry-card" href="{{ url_for('main.customers') }}">
        <span class="entry-number">02</span><strong>客户账目</strong>
        <span>查看发货、收款、预收和历史记录。</span>
    </a>
    <a class="entry-card" href="{{ url_for('main.summary') }}">
        <span class="entry-number">03</span><strong>客户汇总总表</strong>
        <span>按截至日期查看全体客户实时合计。</span>
    </a>
</section>
<section class="notice"><strong>快捷入口</strong><a href="{{ url_for('main.new_retail') }}">厂里零售</a><a href="{{ url_for('main.new_payment') }}">新增收款</a></section>
{% endblock %}
